<script>
  document.addEventListener("DOMContentLoaded", () => {
    const homeIcon = document.querySelector(".navbar .nav-link .bi-house-door");
    const homeLink = homeIcon ? homeIcon.closest("a") : null;

    if (homeLink) {
      homeLink.setAttribute("aria-label", "Home");
      homeIcon.removeAttribute("aria-label");
      homeIcon.removeAttribute("role");
      homeIcon.setAttribute("aria-hidden", "true");
    }
  });
</script>
